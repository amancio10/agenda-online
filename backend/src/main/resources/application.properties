spring.application.name=backend

# ---------- Banco (Neon) ----------
# A conexão vem de DATABASE_URL (veja DotEnv). Pool pequeno: o Neon já faz pooling do lado dele.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0

# As tabelas NÃO são criadas pela aplicação: rode os scripts de backend/db/ no Neon.
# "validate" faz a aplicação parar na inicialização se alguma tabela/coluna estiver faltando.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ---------- Servidor ----------
# O Cloud Run/Render definem PORT; localmente usa 8080.
server.port=${PORT:8080}

# ---------- Aplicação ----------
# Endereços do front autorizados a chamar a API (separe por vírgula).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
app.timezone=${APP_TIMEZONE:America/Sao_Paulo}
# Duração de cada reunião (igual a meetingMinutes em src/app/core/schedule.config.ts).
# Depois do término, a reunião passa a contar como realizada.
app.meeting-minutes=${MEETING_MINUTES:30}

# Login do administrador
app.jwt.secret=${JWT_SECRET}
app.jwt.ttl=${JWT_TTL:8h}
# Opcional: cria o primeiro administrador se ainda não houver nenhum.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# ---------- Aviso por e-mail de novo agendamento ----------
# Desligado enquanto NOTIFY_EMAIL ou MAIL_USERNAME estiverem vazios.
# Padrão: Gmail (porta 587 + STARTTLS) com uma "senha de app" em MAIL_PASSWORD.
app.notify.to=${NOTIFY_EMAIL:}
app.notify.from=${MAIL_FROM:${MAIL_USERNAME:}}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
