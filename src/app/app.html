<header class="topbar">
  <a routerLink="/" class="brand">Agenda online</a>
  <nav>
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      Agendar
    </a>
    @if (auth.isLoggedIn()) {
      <a routerLink="/minha-agenda" routerLinkActive="active">Minha agenda</a>
      <button type="button" class="auth-btn" (click)="auth.logout()" [attr.title]="auth.email()">
        Sair
      </button>
    } @else {
      <a routerLink="/login" class="auth-btn" routerLinkActive="active">Entrar</a>
    }
    <button
      type="button"
      class="theme-toggle"
      (click)="themeService.toggle()"
      [attr.aria-label]="themeService.theme() === 'dark' ? 'Ativar modo claro' : 'Ativar modo escuro'"
      [attr.title]="themeService.theme() === 'dark' ? 'Modo claro' : 'Modo escuro'"
    >
      @if (themeService.theme() === 'dark') {
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
          />
        </svg>
      } @else {
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
      }
    </button>
  </nav>
</header>

<main>
  <router-outlet />
</main>
