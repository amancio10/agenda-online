<section class="panel">
  <h2>Entrar</h2>
  <p class="hint">Área do administrador, para ver e gerenciar as reuniões marcadas.</p>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    @if (error(); as msg) {
      <p class="error" role="alert">{{ msg }}</p>
    }

    <label>
      E-mail
      <input type="email" formControlName="email" autocomplete="username" autofocus />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <small class="field-error">Informe um e-mail válido.</small>
      }
    </label>

    <label>
      Senha
      <input type="password" formControlName="password" autocomplete="current-password" />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <small class="field-error">Informe a senha.</small>
      }
    </label>

    <button type="submit" class="submit" [disabled]="saving()">
      {{ saving() ? 'Entrando…' : 'Entrar' }}
    </button>
  </form>

  <a routerLink="/" class="back">← Voltar para o calendário</a>
</section>
